<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#4f46e5" />
  <meta name="description" content="在局域网内通过浏览器快速互传文件，无需安装客户端。" />
  <title>局域网文件快传</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 8h13l-3-3" />
            <path d="M20 16H7l3 3" />
          </svg>
        </div>
        <div class="brand-text">
          <h1>局域网文件快传</h1>
          <p id="serverLine">正在连接服务器…</p>
        </div>
      </div>

      <div class="topbar-actions">
        <div class="lan-card" id="lanCard">
          <div class="lan-meta">
            <span class="dot"></span>
            <span>局域网访问地址</span>
            <span class="online-count" id="onlineCount">在线 1</span>
          </div>
          <div class="lan-row">
            <select id="lanSelect" title="选择并复制给其他设备使用的地址"></select>
            <button class="icon-button" id="copyLanBtn" title="复制地址" aria-label="复制局域网地址">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="9" y="9" width="13" height="13" rx="2" />
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
              </svg>
            </button>
          </div>
        </div>

        <button class="user-chip" id="userChip" type="button" title="修改我的昵称">
          <span class="avatar" id="userAvatar">访</span>
          <span class="user-name" id="userNameLabel">访客</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4z" />
          </svg>
        </button>

        <button class="btn" id="sendUserBtn" type="button" title="选择局域网中另一位在线用户，把文件直接发送给他">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 2L11 13" />
            <path d="M22 2l-7 20-4-9-9-4z" />
          </svg>
          发送给用户
        </button>

        <button class="icon-button inbox-button" id="inboxBtn" type="button" title="收到的文件" aria-label="收到的文件">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 12h-6l-2 3h-4l-2-3H2" />
            <path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 15.57 4H8.43a2 2 0 0 0-1.79 1.11z" />
          </svg>
          <span class="badge" id="inboxBadge" hidden>0</span>
        </button>

        <button class="btn primary" id="uploadBtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
            <path d="M17 8l-5-5-5 5" />
            <path d="M12 3v12" />
          </svg>
          上传文件
        </button>
        <button class="btn" id="uploadFolderBtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z" />
            <path d="M12 11v6" />
            <path d="M9 14h6" />
          </svg>
          上传文件夹
        </button>
        <button class="icon-button refresh" id="refreshBtn" type="button" title="刷新" aria-label="刷新">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 4v6h-6" />
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10" />
          </svg>
        </button>
      </div>

      <input type="file" id="fileInput" multiple hidden />
      <input type="file" id="folderInput" webkitdirectory directory multiple hidden />
      <input type="file" id="sendFileInput" multiple hidden />
    </header>

    <main class="main">
      <section class="pathbar">
        <nav class="breadcrumb" id="breadcrumb" aria-label="当前路径"></nav>
        <div class="pathbar-tools">
          <label class="search" title="在当前文件夹中筛选">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8" />
              <path d="M21 21l-4.35-4.35" />
            </svg>
            <input id="filterInput" type="search" placeholder="筛选当前文件夹" autocomplete="off" />
          </label>
          <button class="btn small" id="newFolderBtn" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 5v14" />
              <path d="M5 12h14" />
            </svg>
            新建文件夹
          </button>
          <button class="btn small" id="zipBtn" type="button" title="把当前文件夹打包成 ZIP 下载">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 8v13H3V8" />
              <rect x="1" y="3" width="22" height="5" rx="1" />
              <path d="M10 12h4" />
            </svg>
            打包下载
          </button>
        </div>
      </section>

      <section class="summary" id="summary" aria-live="polite"></section>

      <section class="file-card" id="fileCard">
        <div class="file-head" aria-hidden="true">
          <span>名称</span>
          <span class="col-size">大小</span>
          <span class="col-time">修改时间</span>
          <span class="col-actions">操作</span>
        </div>
        <div class="file-list" id="fileList" role="list"></div>
        <div class="empty" id="emptyState" hidden>
          <div class="empty-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z" />
            </svg>
          </div>
          <p id="emptyText">这里还没有文件</p>
          <p class="empty-hint">点击「上传文件」，或把文件直接拖到页面中</p>
        </div>
        <div class="loading-mask" id="loadingMask" hidden><span class="spinner"></span></div>
      </section>
    </main>

    <footer class="footer" id="footer"></footer>
  </div>

  <div class="drop-overlay" id="dropOverlay" hidden>
    <div class="drop-box">
      <div class="drop-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
          <path d="M17 8l-5-5-5 5" />
          <path d="M12 3v12" />
        </svg>
      </div>
      <p>松开鼠标即可上传到当前文件夹</p>
      <span id="dropPath"></span>
    </div>
  </div>

  <section class="upload-panel" id="uploadPanel" hidden aria-label="上传队列">
    <header class="upload-head">
      <div>
        <strong id="uploadTitle">上传队列</strong>
        <span id="uploadSummary">准备中…</span>
      </div>
      <button class="icon-button" id="closeUploadBtn" type="button" title="收起上传面板" aria-label="收起上传面板">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 6L6 18" />
          <path d="M6 6l12 12" />
        </svg>
      </button>
    </header>
    <div class="upload-list" id="uploadList"></div>
  </section>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <div class="modal-overlay" id="modalOverlay" hidden>
    <div class="modal" id="modalCard" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h2 id="modalTitle"></h2>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-actions">
        <button class="btn ghost" id="modalCancel" type="button">取消</button>
        <button class="btn primary" id="modalOk" type="button">确定</button>
      </div>
    </div>
  </div>

  <div class="preview-overlay" id="previewOverlay" hidden>
    <div class="preview-box" role="dialog" aria-modal="true" aria-labelledby="previewTitle">
      <header class="preview-head">
        <span id="previewTitle"></span>
        <div class="preview-tools">
          <a class="btn small" id="previewDownload" href="#" download>下载</a>
          <button class="icon-button" id="previewCloseBtn" type="button" title="关闭预览" aria-label="关闭预览">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 6L6 18" />
              <path d="M6 6l12 12" />
            </svg>
          </button>
        </div>
      </header>
      <div class="preview-body" id="previewBody"></div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
